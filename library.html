<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="robots" content="noindex" />
  <title>Axel Rios — The Library</title>
  <link rel="icon" type="image/x-icon" href="./images/favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500&family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./css/library.css" />
</head>
<body class="library">
  <header class="lib-top">
    <a class="lib-back" href="brain.html">the list</a>
    <p class="lib-name">Axel Rios</p>
  </header>

  <div class="lib-lamp" aria-hidden="true"></div>

  <div class="lib-stage" id="stage">
    <svg class="lib-lines" id="lines" aria-hidden="true"></svg>
    <div id="lattice" class="lattice"></div>
  </div>

  <aside class="volume" id="volume" hidden>
    <p class="volume__n" id="volume-n"></p>
    <p class="volume__text" id="volume-text"></p>
    <ul class="volume__related" id="volume-related"></ul>
    <button class="volume__close" id="volume-close" type="button">close</button>
  </aside>

  <script src="js/aphorisms.js"></script>
  <script src="js/library.js"></script>
</body>
</html>
